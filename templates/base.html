<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SecuTools - Toolkit de Segurança da Informação para Operações de Segurança">
  <meta name="theme-color" content="#0c1222">
  <title>{% block title %}SecuTools{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if show_tools_menu %}
  <header class="header">
    <nav class="navbar" aria-label="Navegação do projeto">
      <a href="{{ url_for('index') }}" class="navbar__brand">
        <span class="navbar__title">SecuTools</span>
      </a>
      
      <button type="button" class="navbar__menu-toggle" aria-label="Abrir menu de ferramentas" aria-expanded="false" aria-controls="tools-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="navbar__menu" id="tools-menu">
        {% for tool in tools %}
        {% if tool.url %}
        <a href="{{ tool.url }}" class="navbar__menu-item" aria-label="{{ tool.name }}" title="{{ tool.name }}"{% if request.path == tool.url %} aria-current="page"{% endif %}>
          <span class="navbar__item-viewport"><span class="navbar__item-label">{{ tool.name }}</span></span>
        </a>
        {% endif %}
        {% endfor %}
      </div>
    </nav>
  </header>
  {% endif %}
  
  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  
  <footer class="footer">
    <p>&copy; 2024 SecuTools. Análise de segurança local, sem envio de dados.</p>
  </footer>

  {% if show_tools_menu %}
  <script src="{{ url_for('static', filename='navbar.js') }}" defer></script>
  <script>
    const menuToggle = document.querySelector('.navbar__menu-toggle');
    const menu = document.querySelector('.navbar__menu');
    
    if (menuToggle) {
      function setMenuOpen(isOpen) {
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        menuToggle.setAttribute('aria-label', isOpen ? 'Fechar menu de ferramentas' : 'Abrir menu de ferramentas');
        menu.classList.toggle('navbar__menu--open', isOpen);
      }

      menuToggle.addEventListener('click', function() {
        const isExpanded = this.getAttribute('aria-expanded') === 'true';
        setMenuOpen(!isExpanded);
      });
      
      // Fechar menu ao clicar em um link
      document.querySelectorAll('.navbar__menu-item').forEach(item => {
        item.addEventListener('click', function() {
          setMenuOpen(false);
        });
      });
      
      // Fechar menu ao clicar fora
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.navbar')) {
          setMenuOpen(false);
        }
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
          setMenuOpen(false);
          menuToggle.focus();
        }
      });

      document.addEventListener('focusin', function(event) {
        if (!event.target.closest('.navbar')) {
          setMenuOpen(false);
        }
      });

      window.matchMedia('(max-width: 1024px)').addEventListener('change', function() {
        setMenuOpen(false);
      });
    }
  </script>
  {% endif %}
</body>
</html>
